name: Build and release

# Every push and pull request builds both ROMs and uploads them as an artifact.
# A vX.Y.Z tag also publishes them as a GitHub release.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'assets/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'assets/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (vX.Y.Z) to rebuild and republish. Leave empty to build the selected branch.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && !inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.name.outputs.name }}
    steps:
      - name: Choose what to build
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          TAG=''
          if [[ -n "$INPUT_TAG" ]]; then TAG=$INPUT_TAG; elif [[ "$REF_TYPE" == tag ]]; then TAG=$REF_NAME; fi
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vX.Y.Z'; exit 1; }
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Name the build
        id: name
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "name=${TAG:-$(git describe --tags --always)}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          curl --fail --location --retry 3 --output /tmp/gbdk.tar.gz \
            https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          echo 'd7857a5f6d135ee4c249043ca26aad9f2ec8ab5d4106d97720d404114f42605c  /tmp/gbdk.tar.gz' | sha256sum --check
          tar -xzf /tmp/gbdk.tar.gz -C /tmp
          python -m pip install Pillow==12.3.0 pyboy==2.8.1 numpy==2.5.3

      - name: Build and check both cartridges
        run: make releases GBDK_HOME=/tmp/gbdk/ PYTHON=python

      - name: Check routing, mapper variants, display fonts and screen text
        run: |
          python tests/smoke.py
          python tests/variants.py
          python tests/display_font.py
          python tests/screen_text.py

      - name: Check the build matches the committed hashes
        run: git diff --exit-code -- SHA256SUMS

      - name: Package ROMs
        env:
          NAME: ${{ steps.name.outputs.name }}
        run: |
          mkdir -p dist
          cp 'Bacon Bit Bench (MBC5).gbc' "dist/Bacon.Bit.Bench.MBC5.$NAME.gbc"
          cp 'Bacon Bit Bench (MBC3).gbc' "dist/Bacon.Bit.Bench.MBC3.$NAME.gbc"
          cd dist
          sha256sum -- *.gbc > SHA256SUMS
          sha256sum --check SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bacon.Bit.Bench.${{ steps.name.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Bacon.Bit.Bench.${{ needs.build.outputs.name }}
          path: dist

      - name: Publish ROMs and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          sha256sum --check SHA256SUMS
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Bacon Bit Bench $TAG" --generate-notes
          fi
          gh release upload "$TAG" --clobber -- '*.gbc' SHA256SUMS
          gh release edit "$TAG" --draft=false
          mkdir verified
          gh release download "$TAG" --dir verified --pattern '*.gbc' --pattern SHA256SUMS
          cd verified
          sha256sum --check SHA256SUMS
